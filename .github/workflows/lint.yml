name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: shellcheck bash/*.sh

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run media-renamer tests
        working-directory: python/media-renamer
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Run command-executor tests
        working-directory: python/command-executor
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          # PSAvoidUsingWriteHost: this is an interactive console script;
          # Write-Host is appropriate here.
          $results = Invoke-ScriptAnalyzer -Path powershell -Recurse `
            -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
